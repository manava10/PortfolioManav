  <g clip-path="url(#tile-clip)"><rect x="6" y="6" width="84" height="84" fill="url(#light)"/></g>
  <rect x="6.5" y="6.5" width="83" height="83" rx="20.5" fill="none" stroke="url(#rim)"/>
