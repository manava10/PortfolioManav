    <linearGradient id="vinyl" x1="28" y1="25" x2="68" y2="74" gradientUnits="userSpaceOnUse"><stop stop-color="#44404e"/><stop offset="0.45" stop-color="#272332"/><stop offset="1" stop-color="#181620"/></linearGradient>
    <linearGradient id="label" x1="37" y1="35" x2="58" y2="61" gradientUnits="userSpaceOnUse"><stop stop-color="#f9cad9"/><stop offset="1" stop-color="#d787a7"/></linearGradient>
