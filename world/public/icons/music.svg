<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="music-title">
  <title id="music-title">Music</title>
  <defs>
    <linearGradient id="tile" x1="18" y1="6" x2="77" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dd7b9d"/><stop offset="0.48" stop-color="#bd527d"/><stop offset="1" stop-color="#873956"/>
    </linearGradient>
    <radialGradient id="light" cx="17" cy="9" r="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.24"/><stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="16" y1="6" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.72"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#111526" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="tile-shadow" x="0" y="0" width="96" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#0b1020" flood-opacity="0.24"/>
    </filter>
    <filter id="object-shadow" x="-35%" y="-35%" width="170%" height="185%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#131126" flood-opacity="0.25"/>
    </filter>
