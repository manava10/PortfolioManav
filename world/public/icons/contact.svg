<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="contact-title">
  <title id="contact-title">Leave Manav a Message</title>
  <defs>
    <linearGradient id="tile" x1="18" y1="6" x2="77" y2="90" gradientUnits="userSpaceOnUse">
