<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="terminal-title">
  <title id="terminal-title">Terminal</title>
  <defs>
    <linearGradient id="tile" x1="18" y1="6" x2="77" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66707c"/><stop offset="0.48" stop-color="#414953"/><stop offset="1" stop-color="#252b33"/>
    </linearGradient>
    <radialGradient id="light" cx="17" cy="9" r="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.24"/><stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="16" y1="6" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.72"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#111526" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="tile-shadow" x="0" y="0" width="96" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#0b1020" flood-opacity="0.24"/>
    </filter>
    <filter id="object-shadow" x="-35%" y="-35%" width="170%" height="185%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#131126" flood-opacity="0.25"/>
    </filter>
    <clipPath id="tile-clip"><rect x="6" y="6" width="84" height="84" rx="21"/></clipPath>
    <linearGradient id="screen" x1="22" y1="24" x2="72" y2="72" gradientUnits="userSpaceOnUse"><stop stop-color="#202832"/><stop offset="1" stop-color="#10171f"/></linearGradient>
  </defs>
  <rect x="6" y="6" width="84" height="84" rx="21" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <g clip-path="url(#tile-clip)"><rect x="6" y="6" width="84" height="84" fill="url(#light)"/></g>
  <rect x="6.5" y="6.5" width="83" height="83" rx="20.5" fill="none" stroke="url(#rim)"/>
  <g filter="url(#object-shadow)">
    <rect x="18" y="23" width="60" height="51" rx="7" fill="url(#screen)" stroke="#c8d0db" stroke-opacity="0.45" stroke-width="1.1"/>
    <path d="M19 35H77" fill="none" stroke="#4a535e"/>
    <circle cx="25" cy="29" r="1.5" fill="#95a4b5"/>
    <circle cx="31" cy="29" r="1.5" fill="#748193"/>
    <circle cx="37" cy="29" r="1.5" fill="#566474"/>
    <path d="M29 44L39 52L29 60" fill="none" stroke="#dbefea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 62H61" fill="none" stroke="#b3d8cb" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
